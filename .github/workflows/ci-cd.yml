name: CI/CD

on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: "dispatch default"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - if: github.ref != 'refs/heads/main'
        run: pnpm build

  image:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t "${{ steps.meta.outputs.image }}" -t "${{ steps.meta.outputs.repo }}:latest" .
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.repo }}:latest"

  deploy:
    needs: [check, image]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.image.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        env:
          TAG: ${{ inputs.tag }}
          BUILT_IMAGE: ${{ needs.image.outputs.image }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          if [[ -n $TAG ]]; then
            export IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"
          else
            export IMAGE="$BUILT_IMAGE"
          fi
          ./deploy/deploy.sh
