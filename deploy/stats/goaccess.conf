date-format %d/%b/%Y
time-format %T
log-format %h %^[%d:%t %^] "%r" %s %b "%R" "%u" %T "%C"

output /var/www/senzi-stats/index.html
db-path /var/lib/goaccess
persist true
restore true
keep-last 365

tz Europe/Moscow
no-query-string true
ignore-crawlers true
real-os true
no-progress true

html-report-title senzi.dev
html-prefs {"theme":"darkPurple","perPage":10}
