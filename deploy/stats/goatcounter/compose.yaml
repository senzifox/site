name: goatcounter

services:
  goatcounter:
    image: arp242/goatcounter:2.7.0
    container_name: goatcounter
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:8080"
    volumes:
      - data:/home/goatcounter/goatcounter-data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
