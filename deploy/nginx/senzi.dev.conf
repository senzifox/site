map $http_user_agent $senzi_terminal {
    default 0;
    ~*(curl|wget|httpie|libcurl|lwp|python-requests|powershell) 1;
}

upstream senzi_site {
    server 127.0.0.1:3001;
    keepalive 8;
}

server {
    listen 80;
    server_name senzi.dev www.senzi.dev;

    location / {
        error_page 418 = @site;
        if ($senzi_terminal) {
            return 418;
        }
        return 301 https://$host$request_uri;
    }

    location @site {
        proxy_pass http://senzi_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name senzi.dev www.senzi.dev;

    ssl_certificate /etc/letsencrypt/live/senzi.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senzi.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://senzi_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
