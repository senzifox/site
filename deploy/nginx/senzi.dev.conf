map $http_user_agent $senzi_terminal {
    default 0;
    ~*(curl|wget|httpie|libcurl|lwp|python-requests|powershell) 1;
}

map "$http_next_router_prefetch$http_next_router_segment_prefetch" $senzi_prefetch {
    "" 0;
    default 1;
}

map "$senzi_prefetch:$uri" $senzi_loggable {
    ~^1: 0;
    ~^0:/api/ 0;
    default 1;
}

map $upstream_http_x_nextjs_cache $senzi_cache {
    "" "-";
    default $upstream_http_x_nextjs_cache;
}

log_format senzi '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $bytes_sent "$http_referer" "$http_user_agent" '
                 '$request_time "$senzi_cache"';

upstream senzi_site {
    server 127.0.0.1:3001;
    keepalive 8;
}

server {
    listen 80;
    server_name senzi.dev www.senzi.dev;

    server_tokens off;
    access_log off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;

    location / {
        error_page 418 = @site;
        if ($senzi_terminal) {
            return 418;
        }
        return 301 https://senzi.dev$request_uri;
    }

    location @site {
        access_log /var/log/nginx/senzi.access.log senzi if=$senzi_loggable;
        proxy_pass http://senzi_site;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name senzi.dev www.senzi.dev;

    server_tokens off;
    access_log /var/log/nginx/senzi.access.log senzi if=$senzi_loggable;

    ssl_certificate /etc/letsencrypt/live/senzi.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senzi.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:senzi_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;

    if ($host != senzi.dev) {
        return 301 https://senzi.dev$request_uri;
    }

    location / {
        proxy_pass http://senzi_site;
    }

    location = /stats {
        return 301 /stats/;
    }

    location /stats/ {
        access_log off;
        auth_basic senzi.dev;
        auth_basic_user_file /etc/nginx/senzi-stats.htpasswd;
        alias /var/www/senzi-stats/;
        index index.html;
    }
}
