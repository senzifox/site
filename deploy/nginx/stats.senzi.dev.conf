map $http_upgrade $senzi_stats_connection {
    default upgrade;
    "" "";
}

server {
    listen 80;
    server_name stats.senzi.dev;

    server_tokens off;
    access_log off;

    return 301 https://stats.senzi.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name stats.senzi.dev;

    server_tokens off;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/senzi.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senzi.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:senzi_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $senzi_stats_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cf-Connecting-Ip "";
        proxy_set_header Fly-Client-Ip "";
        proxy_set_header X-Azure-Socketip "";
    }
}
